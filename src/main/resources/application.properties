server.port=${PORT:7070}
spring.application.name=GB_Colors

# Auto-schema: create/update database tables automatically on startup
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# HikariCP tuned low-footprint pool (friendly to 1 GB RAM Oracle E2.1.Micro)
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=15000

gbcolors.app-name=${APP_NAME:GB_Colors}
gbcolors.frontend-origin=${FRONTEND_ORIGIN:*}
gbcolors.admin-email=${ADMIN_EMAIL:gbcolor@admin.com}
gbcolors.admin-default-password=${ADMIN_DEFAULT_PASSWORD:Admin@123}

gbcolors.smtp.host=${SMTP_HOST:smtp.gmail.com}
gbcolors.smtp.port=${SMTP_PORT:587}
gbcolors.smtp.user=${SMTP_USER:gbcolor@admin.com}
gbcolors.smtp.pass=${SMTP_PASS:}
gbcolors.smtp.from-name=${SMTP_FROM_NAME:GB_Colors}

gbcolors.upi-id=${UPI_ID:gbpayment0@nyes}
gbcolors.upi-payee-name=${UPI_PAYEE_NAME:GB Colors}
gbcolors.razorpay.key-id=${RAZORPAY_KEY_ID:}
gbcolors.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
gbcolors.seed-sample-users=${SEED_SAMPLE_USERS:false}
